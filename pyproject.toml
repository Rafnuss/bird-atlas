[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-atlas"
version = "0.1.0"
requires-python = ">=3.11.8"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "geopandas>=1,<2",
    "shapely>=2,<3",
    "pyproj>=3.6,<4",
    "requests>=2.32,<3",
    "frictionless>=5.18,<6",
    "duckdb>=1.4,<2",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "matplotlib>=3.8,<4", "ipykernel>=6,<8", "nbclient>=0.10,<1"]

[tool.setuptools.packages.find]
include = ["bird_atlas*"]
