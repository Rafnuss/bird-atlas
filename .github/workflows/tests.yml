name: Scientific checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run ruff check bird_atlas scripts tests --select E9,F
      - run: uv run python tests/check_notebook.py
